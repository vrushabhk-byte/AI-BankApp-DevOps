apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankapp-rollback-test
  namespace: bankapp
  labels:
    app: bankapp-rollback-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bankapp-rollback-test
  template:
    metadata:
      labels:
        app: bankapp-rollback-test
    spec:
      containers:
        - name: bankapp-rollback-test
          image: ai-bankapp:ci-11
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: MYSQL_HOST
              value: mysql
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DATABASE
              value: bankappdb
            - name: MYSQL_USER
              value: root
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bankapp-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: OLLAMA_URL
              value: http://ollama:11434
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
