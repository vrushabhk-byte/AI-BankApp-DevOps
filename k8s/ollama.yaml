apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data
  namespace: bankapp
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: bankapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          volumeMounts:
            - name: ollama-storage
              mountPath: /root/.ollama
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: ollama-storage
          persistentVolumeClaim:
            claimName: ollama-data
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: bankapp
spec:
  type: ClusterIP
  selector:
    app: ollama
  ports:
    - name: ollama
      port: 11434
      targetPort: 11434
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-model-pull
  namespace: bankapp
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: model-pull
          image: ollama/ollama:latest
          env:
            - name: OLLAMA_HOST
              value: http://ollama:11434
          command:
            - /bin/sh
            - -c
            - |
              until ollama list >/dev/null 2>&1; do
                echo "Waiting for Ollama..."
                sleep 5
              done
              ollama pull tinyllama
