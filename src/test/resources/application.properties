# H2 in-memory database for automated tests
spring.datasource.url=jdbc:h2:mem:bankapp-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA and Hibernate test configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable SQL initialization during tests
spring.sql.init.mode=never

# Ollama configuration required by ChatService
ollama.url=http://localhost:11434
ollama.model=tinyllama
